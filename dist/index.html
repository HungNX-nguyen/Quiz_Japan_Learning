/* UI UX Pro Max: minimal, content-first learning interface.
   System fonts preserve Vietnamese/Japanese coverage and offline use. */
:root{--ink:#441023;--muted:#7b3f55;--accent:#6b1937;--accent-soft:#f7e0e8;--paper:#fae9ef;--line:#edccd8;--purple:var(--accent);--purple-dark:#4f1329;--border:var(--line);font-size:16px;color:var(--ink);background:var(--paper)}
body{background:var(--paper);color:var(--ink)}
::selection{background:#f3adc7;color:#431023}
button,a,summary{touch-action:manipulation}
button{transition:background-color .18s ease,border-color .18s ease,box-shadow .18s ease}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #6d1938;outline-offset:4px}
.site-header{height:88px;background:#fffef9;border-bottom:1px solid var(--line);padding-inline:max(28px,calc((100vw - 1420px)/2));gap:24px}
.brand{font-family:"Segoe UI",sans-serif;font-size:22px;letter-spacing:-.6px;color:#431023}
.brand-mark{width:46px;height:46px;border-radius:12px;background:var(--accent);font-size:29px;box-shadow:0 3px 0 #410f21}
.brand-sub{font-size:12px;color:var(--muted);margin-top:5px;letter-spacing:0}
.site-header nav{gap:28px;font-size:14px;font-weight:600}
.site-header nav button{color:var(--muted);min-height:44px;font-size:14px}
.site-header nav button:hover{color:var(--accent)}
.nav-active{border-color:var(--accent);color:var(--accent)}
.page-shell{max-width:1480px;padding:36px 28px 0;grid-template-columns:224px minmax(0,1fr);gap:38px}
.sidebar{padding-top:5px}
.sidebar-label{font-size:11px;letter-spacing:1.5px;color:var(--muted);padding:0 8px 20px}
.sidebar-label>span{font-size:12px;color:var(--muted)}
.lesson-list{gap:10px}
.lesson{padding:16px 12px;gap:12px;min-height:86px;border-radius:12px;border:1px solid transparent}
.lesson:hover{background:#f6e0e8;border-color:#e8c4d1}
.lesson.selected{background:#f6d6e2;border-color:#cf8ca4;box-shadow:inset 3px 0 var(--accent)}
.lesson-number{height:42px;width:36px;border-radius:8px;color:#843c56;background:#f2d4df;font-family:"Segoe UI",sans-serif;font-size:23px;font-weight:600}
.selected .lesson-number{background:var(--accent);color:white}
.lesson-copy strong{font-size:14px;color:var(--ink)}
.lesson-copy small{color:var(--muted);font-size:11px;line-height:1.5;margin-top:4px}

/* Sakura theme (UI UX Pro Max): soft pink + white, rounded "clay" cards,
   sakura falling petals. Text tokens keep >= 4.5:1 contrast on white/paper. */
:root{
  --ink:#3d1428;--muted:#7a4a5e;--accent:#c2185b;--accent-dark:#9c1048;--accent-soft:#fde4ee;
  --sakura-100:#fff0f5;--sakura-200:#fcd9e6;--sakura-300:#f8b8cf;--sakura-400:#f48fb1;
  --paper:#fff7fa;--card:#ffffff;--card-soft:#fffafc;--glass:#ffffffd9;--line:#f6d3e0;--border:var(--line);
  --accent-fill:#c2185b;--ok:#2e7d4f;--ok-soft:#e7f5ec;--ok-line:#8fcaa6;
  --shadow-sm:0 2px 6px #c2185b0f,0 1px 2px #3d142810;
  --shadow-md:0 10px 30px #c2185b14,0 2px 6px #3d14280d;
  --shadow-lg:0 24px 60px #c2185b1f,0 6px 16px #3d142812;
  --radius:20px;
  --font-display:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",Georgia,serif;
  color:var(--ink);background:var(--paper)
}
html{scroll-behavior:smooth;overflow-x:clip}
body{background:
  radial-gradient(1200px 600px at 100% -10%,#ffe3ee 0,transparent 60%),
  radial-gradient(900px 500px at -10% 30%,#fff0f5 0,transparent 60%),
  var(--paper);background-attachment:fixed;color:var(--ink);min-height:100vh}
::selection{background:#f8b8cf;color:#3d1428}
button,a,summary{cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}
main:focus{outline:none}

/* Petal canvas: behind content by default, in front on the home page. */
.sakura-canvas{position:fixed;inset:0;pointer-events:none;z-index:0}
.sakura-canvas.front{z-index:30}
.site-header,.page-shell,.home,.subpage,.site-footer{position:relative;z-index:1}
.modal-backdrop{z-index:50}

.skip-link{position:absolute;left:16px;top:-60px;z-index:60;background:var(--accent-fill);color:#fff;padding:10px 16px;border-radius:10px;text-decoration:none;font-weight:600}
.skip-link:focus{top:12px}

/* Header */
.site-header{position:sticky;top:0;z-index:20;height:76px;background:var(--glass);backdrop-filter:blur(12px) saturate(1.4);-webkit-backdrop-filter:blur(12px) saturate(1.4);border-bottom:1px solid var(--line)}
.brand{color:var(--ink);font-family:var(--font-display);font-weight:700;letter-spacing:-.3px}
.brand-mark{background:linear-gradient(145deg,#f48fb1,#c2185b);color:#fff;border-radius:14px;box-shadow:0 4px 0 #9c1048,0 8px 18px #c2185b33;font-family:var(--font-display)}
.brand-mark.small{width:34px;height:34px;font-size:19px;border-radius:10px;box-shadow:0 3px 0 #9c1048;display:inline-grid;place-items:center}
.brand-sub{color:var(--muted)}
.site-header nav{gap:6px;height:auto}
.nav-link{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;color:var(--muted);font-size:14px;font-weight:600;text-decoration:none;transition:background-color .2s ease,color .2s ease}
.nav-link:hover{background:var(--sakura-100);color:var(--accent-dark)}
.nav-link.active{background:var(--accent-soft);color:var(--accent-dark);box-shadow:inset 0 0 0 1px var(--sakura-300)}
.petal-toggle{width:44px;height:44px;display:grid;place-items:center;border-radius:999px;border:1px solid var(--line)!important;background:var(--card)!important;color:var(--muted)!important;margin-left:6px;padding:0!important}
.petal-toggle.on{color:var(--accent)!important;background:var(--accent-soft)!important;border-color:var(--sakura-300)!important}
.petal-toggle:hover{border-color:var(--sakura-400)!important}

/* Buttons */
.primary,.secondary{border-radius:14px;transition:transform .2s ease,box-shadow .2s ease,background-color .2s ease;display:inline-flex;align-items:center;justify-content:center}
.primary{background:linear-gradient(180deg,#d63a75,#c2185b);color:#fff;border:0;box-shadow:0 4px 0 #9c1048,0 10px 22px #c2185b33}
.primary:hover{background:linear-gradient(180deg,#c92f6a,#ad1452);transform:translateY(-1px)}
.primary:active{transform:translateY(2px);box-shadow:0 2px 0 #9c1048,0 4px 10px #c2185b2a}
.secondary{background:var(--card);color:var(--accent-dark);border:1.5px solid var(--sakura-300)}
.secondary:hover{background:var(--sakura-100);border-color:var(--sakura-400)}
.big{min-height:54px;padding:15px 24px;font-size:15px}
.text-button{color:var(--accent-dark)}
.text-button:hover{background:var(--sakura-100)}
kbd{background:var(--card);border-color:var(--sakura-300);color:var(--accent-dark)}

/* Practice page re-skin */
.section-kicker{color:var(--accent);letter-spacing:1.6px}
.eyebrow{color:var(--accent)}
.eyebrow>span{background:var(--accent)}
.intro h1{color:var(--ink);font-family:var(--font-display)}
.intro h1>span{color:var(--sakura-400)}
.intro p,.lesson-heading p{color:var(--muted)}
.intro-kanji{color:var(--sakura-300)}
.lesson:hover{background:var(--sakura-100);border-color:var(--line)}
.lesson.selected{background:var(--card);border-color:var(--sakura-300);box-shadow:inset 3px 0 var(--accent),var(--shadow-sm)}
.lesson-number{background:var(--sakura-100);color:var(--accent-dark)}
.selected .lesson-number{background:var(--accent-fill);color:#fff}
.mini-track{background:var(--sakura-200)}
.mini-track>span{background:var(--accent)}
.lesson-count,.lesson-copy small,.sidebar-label,.sidebar-label>span,.local-tag{color:var(--muted)}
.sidebar-note{background:linear-gradient(160deg,var(--card) 0,var(--accent-soft) 100%);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.sidebar-note h3{color:var(--ink)}
.sidebar-note p,.sidebar-note .tiny{color:var(--muted)}
.leaf-stamp{background:var(--accent-fill);color:#fff}
.note-line{background:var(--sakura-300)}
.local-tag>span{background:var(--accent-fill)}
.mode-tabs{background:var(--sakura-100);border-color:var(--line);border-radius:14px}
.mode-tabs button{color:var(--muted);border-radius:10px}
.mode-tabs button:hover{color:var(--accent-dark)}
.mode-tabs button.active{background:var(--card);color:var(--accent-dark);box-shadow:var(--shadow-sm)}
.mode-tabs button>span{background:var(--accent-soft);color:var(--accent-dark)}
.quiz-card,.progress-card,.route-card{background:var(--card);border-color:var(--line);border-radius:var(--radius);box-shadow:var(--shadow-md)}
.route-card{background:linear-gradient(180deg,var(--card),var(--sakura-100))}
.type-pill{background:var(--accent-soft);color:var(--accent-dark)}
.question-meta,.question-instruction,.question-bottom,.keyboard-hint,.under-card{color:var(--muted)}
.question-progress{background:var(--sakura-100)}
.question-progress>span{background:linear-gradient(90deg,var(--sakura-400),var(--accent))}
.japanese-sentence{color:var(--ink)}
.blank{background:var(--accent-soft);color:var(--accent-dark);border-bottom-color:var(--accent)}
.option{background:var(--card);border-color:var(--line);border-radius:14px}
.option:not(:disabled):hover{background:var(--sakura-100);border-color:var(--sakura-400);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.option{transition:transform .18s ease,background-color .18s ease,border-color .18s ease,box-shadow .18s ease}
.option>span[lang]{color:var(--ink)}
.option-letter{background:var(--sakura-100);color:var(--accent-dark)}
.option:disabled:not(.correct):not(.incorrect){background:var(--card-soft);color:var(--muted)}
.option.correct{border-color:var(--ok-line);background:var(--ok-soft);color:var(--ok)}
.option.correct .option-letter{background:#c9ead5;color:#1f5c38}
.blank.filled{background:var(--ok-soft);border-color:var(--ok);color:#1f5c38}
.small-dot,.under-card svg{color:var(--accent);background:var(--accent)}
.under-card svg{background:none}
.progress-ring{background:conic-gradient(var(--accent) var(--progress),var(--sakura-100) 0)}
.progress-ring strong,.route-numbers>strong{color:var(--ink)}
.purple{background:var(--accent)}
.feedback{border-top-color:var(--line)}
.feedback-icon{background:var(--ok-soft);color:var(--ok)}
.feedback h4{color:var(--ok)}
.needs-review .feedback-icon{background:#fdebdc;color:#9a4a17}
.needs-review h4{color:#9a4a17}
.translation{background:var(--sakura-100);color:var(--ink);border-radius:14px}
.explanation p,.distractors p,.source-line,.feedback-heading p,.vocab-row small,.stats-note,.stat-row>span,.stat-row strong,.route-card p,.route-numbers>span{color:var(--muted)}
.grammar-chip{background:var(--card-soft);border-color:var(--sakura-300);color:var(--muted);border-radius:12px}
.grammar-chip>span[lang]{color:var(--accent-dark)}
.vocab-row{border-color:var(--line)}
.vocab-row span{color:var(--accent-dark)}
.distractors summary,details summary,.source-line a{color:var(--accent-dark)}
.empty-icon{background:var(--accent-soft);color:var(--accent)}
.result-score{color:var(--accent)}
.result-list>div{color:var(--ink)}
.modal-backdrop{background:#3d142855}
.modal{background:var(--card);border-color:var(--line);border-radius:24px;box-shadow:var(--shadow-lg)}
.icon-button{background:var(--sakura-100);color:var(--accent-dark)}
.grammar-list li{border-color:var(--line)}
.grammar-index{color:var(--accent)}
.grammar-list strong{color:var(--ink)}
.grammar-list p,.grammar-list small,.modal-note,.help-content p,.help-content li{color:var(--muted)}
.grammar-list a{color:var(--accent-dark)}
.lookup-term{background:var(--sakura-100)}
.lookup-entry p,.lookup-note,.lookup-notes,.lookup-entry small,.lookup-footnote{color:var(--muted)}
.lookup-entry .lookup-reading,.lookup-entry .lookup-meaning,.lookup-hanviet{color:var(--accent-dark)}
.study-tip{color:var(--accent)}
.study-tip p{color:var(--muted)}.study-tip strong{color:var(--ink)}
footer{color:var(--muted);border-color:var(--line)}

/* ---------- Home page ---------- */
.home,.subpage{max-width:1240px;margin:0 auto;padding:0 28px}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px;align-items:center;padding:64px 0 56px;min-height:min(640px,calc(100vh - 76px))}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--sakura-300);color:var(--accent-dark);font-size:13px;font-weight:600;box-shadow:var(--shadow-sm)}
.hero h1{font-family:var(--font-display);font-size:clamp(36px,5vw,62px);line-height:1.18;letter-spacing:-1.2px;color:var(--ink);margin:22px 0 20px;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--accent);background:linear-gradient(180deg,transparent 62%,#fcd9e6 62%);padding:0 4px}
.hero-copy>p{font-size:17px;line-height:1.8;color:var(--muted);max-width:560px;margin:0 0 30px}
.hero-actions{display:flex;flex-wrap:wrap;gap:14px}
.hero-stats{display:flex;gap:14px;margin:38px 0 0;padding:0}
.hero-stats>div{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:14px 20px;min-width:118px;box-shadow:var(--shadow-sm)}
.hero-stats dt{font-size:12px;color:var(--muted);font-weight:600}
.hero-stats dd{margin:4px 0 0;font-family:var(--font-display);font-size:30px;font-weight:700;color:var(--accent-dark)}
.hero-art{position:relative;min-height:440px;display:grid;place-items:center}
.hero-art::before{content:"";position:absolute;width:min(420px,90%);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff 0,#ffe3ee 55%,#fcd0e0 100%);box-shadow:inset 0 -20px 40px #f48fb133,0 30px 60px #c2185b1a}
.branch{position:absolute;top:-10px;right:0;width:min(440px,100%);z-index:1;filter:drop-shadow(0 8px 14px #c2185b22)}
.hero-kanji{position:absolute;left:4%;bottom:6%;font-family:var(--font-display);font-size:120px;line-height:1;color:#f8b8cf;opacity:.75;z-index:0}
.hero-card{position:relative;z-index:2;width:250px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow-lg);margin-top:120px}
.hero-ring{width:132px;height:132px;margin:16px auto;padding:9px;border-radius:50%;background:conic-gradient(var(--accent) var(--progress),var(--sakura-100) 0)}
.hero-ring>div{width:100%;height:100%;border-radius:50%;background:var(--card);display:grid;place-content:center;text-align:center}
.hero-ring strong{font-size:32px;color:var(--ink);font-family:var(--font-display)}
.hero-ring strong span{font-size:16px;color:var(--muted)}
.hero-ring small{font-size:11px;color:var(--muted);max-width:90px}
.hero-card-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:9px 0;border-top:1px solid var(--line)}
.hero-card-row strong{color:var(--ink)}

.home-section{padding:56px 0}
.section-head{text-align:center;max-width:640px;margin:0 auto 34px}
.section-head h2{font-family:var(--font-display);font-size:clamp(26px,3vw,36px);color:var(--ink);margin:10px 0 12px;letter-spacing:-.5px;text-wrap:balance}
.section-head p{color:var(--muted);font-size:15px;line-height:1.8;margin:0}
.lesson-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.lesson-card{position:relative;overflow:hidden;text-align:left;display:flex;flex-direction:column;gap:8px;padding:24px 22px 20px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-md);color:var(--ink);font:inherit;min-height:220px;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.lesson-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--sakura-300)}
.lesson-card-kanji{position:absolute;right:-6px;top:-14px;font-family:var(--font-display);font-size:104px;line-height:1;color:var(--sakura-100);pointer-events:none;transition:color .25s ease}
.lesson-card:hover .lesson-card-kanji{color:var(--sakura-200)}
.lesson-card>*{position:relative}
.lesson-card-num{display:inline-flex;align-self:flex-start;padding:5px 12px;border-radius:999px;background:var(--accent-fill);color:#fff;font-size:12px;font-weight:700}
.lesson-card strong{font-size:17px;line-height:1.45;margin-top:8px}
.lesson-card small{color:var(--muted);font-size:13px}
.lesson-card-track{display:block;height:6px;border-radius:6px;background:var(--sakura-100);overflow:hidden;margin-top:auto}
.lesson-card-track>span{display:block;height:100%;background:linear-gradient(90deg,var(--sakura-400),var(--accent));border-radius:6px}
.lesson-card-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-top:6px}
.lesson-card-foot svg{color:var(--accent);transition:transform .2s ease}
.lesson-card:hover .lesson-card-foot svg{transform:translateX(4px)}

.feature-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.feature{background:var(--glass);border:1px solid var(--line);border-radius:var(--radius);padding:26px 22px;box-shadow:var(--shadow-sm)}
.feature-icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 -3px 0 var(--sakura-300)}
.feature h3{font-size:17px;margin:18px 0 8px;color:var(--ink)}
.feature p{font-size:14px;line-height:1.75;color:var(--muted);margin:0}

.steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;counter-reset:none}
.steps li{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px 24px;box-shadow:var(--shadow-sm)}
.step-num{font-family:var(--font-display);font-size:40px;font-weight:700;color:var(--sakura-300);line-height:1}
.steps h3{font-size:17px;color:var(--ink);margin:12px 0 8px}
.steps p{font-size:14px;line-height:1.75;color:var(--muted);margin:0}

.quote-band{margin:40px 0 24px;padding:56px 32px;border-radius:32px;text-align:center;background:linear-gradient(135deg,var(--accent-soft) 0,var(--card) 50%,var(--sakura-200) 100%);border:1px solid var(--sakura-300);box-shadow:var(--shadow-md)}
.quote-ja{font-family:var(--font-display);font-size:clamp(24px,3vw,36px);color:var(--accent-dark);margin:0 0 12px}
.quote-vi{font-size:16px;color:var(--muted);line-height:1.8;max-width:560px;margin:0 auto 26px}

.site-footer{max-width:1240px;margin:32px auto 0;padding:26px 28px 34px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
.site-footer>div{display:flex;align-items:center;gap:10px}
.site-footer strong{color:var(--ink);font-size:15px}
.site-footer p{margin:0;line-height:1.7}

/* ---------- Sub pages ---------- */
.subpage{padding-top:48px}
.subpage-head{max-width:760px;margin-bottom:30px}
.subpage-head h1{font-family:var(--font-display);font-size:clamp(30px,4vw,46px);color:var(--ink);margin:10px 0 14px;letter-spacing:-.8px;text-wrap:balance}
.subpage-head p{font-size:15px;color:var(--muted);line-height:1.85;margin:0}
.roadmap-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.roadmap-tabs button{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;min-height:64px;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.roadmap-tabs button small{color:var(--muted);font-size:12px}
.roadmap-tabs button:hover{border-color:var(--sakura-400);background:var(--sakura-100)}
.roadmap-tabs button.active{border-color:var(--accent);background:var(--accent-soft);box-shadow:var(--shadow-sm)}
.roadmap-tabs button.active strong{color:var(--accent-dark)}
.roadmap-panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow-md)}
.roadmap-panel-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line)}
.roadmap-panel-head h2{margin:0 0 4px;font-size:24px;color:var(--ink)}
.roadmap-panel-head p{margin:0;color:var(--muted);font-size:14px}
.roadmap-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 32px}
.roadmap-list li{display:flex;gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}
.roadmap-list .grammar-index{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--sakura-400);min-width:30px}
.roadmap-list strong{display:block;font-size:17px;color:var(--ink);margin-bottom:4px}
.roadmap-list p{margin:0 0 4px;font-size:14px;color:var(--accent-dark);font-weight:600}
.roadmap-list small{display:block;font-size:13px;line-height:1.7;color:var(--muted)}
.roadmap-list a{display:inline-flex;align-items:center;min-height:36px;font-size:12px;color:var(--accent-dark)}
.guide-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.guide-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow-md)}
.guide-card h2{display:flex;align-items:center;gap:10px;font-size:18px;color:var(--ink);margin:0 0 14px}
.guide-card h2 svg{color:var(--accent)}
.guide-card h2:not(:first-child){margin-top:24px}
.guide-card p,.guide-card li{font-size:14px;line-height:1.85;color:var(--muted)}
.guide-card ol{padding-left:20px;margin:0}
.shortcut-list{list-style:none;padding:0;margin:0}
.shortcut-list li{display:flex;gap:12px;align-items:center;padding:6px 0}
.shortcut-list li>span{min-width:74px}
.guide-cta{text-align:center;margin:36px 0 8px}

/* ---------- Motion: gentle entrance ---------- */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero-copy>*,.hero-art,.lesson-card,.feature,.steps li,.subpage-head,.roadmap-panel,.guide-card{animation:rise .55s cubic-bezier(.2,.7,.3,1) both}
.hero-copy>*:nth-child(2){animation-delay:.06s}.hero-copy>*:nth-child(3){animation-delay:.12s}.hero-copy>*:nth-child(4){animation-delay:.18s}.hero-copy>*:nth-child(5){animation-delay:.24s}
.hero-art{animation-delay:.15s}
.lesson-card:nth-child(2),.feature:nth-child(2),.steps li:nth-child(2),.guide-card:nth-child(2){animation-delay:.07s}
.lesson-card:nth-child(3),.feature:nth-child(3),.steps li:nth-child(3),.guide-card:nth-child(3){animation-delay:.14s}
.lesson-card:nth-child(4),.feature:nth-child(4){animation-delay:.21s}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(-1.6deg)}}
.branch{transform-origin:100% 10%;animation:sway 7s ease-in-out infinite}

/* ---------- Responsive ---------- */
@media(max-width:1100px){
  .lesson-cards,.feature-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .guide-grid{grid-template-columns:1fr 1fr}
  .roadmap-list{grid-template-columns:1fr}
}
@media(max-width:860px){
  .hero{grid-template-columns:1fr;padding:40px 0 24px;min-height:0;gap:8px}
  .hero-art{min-height:380px}
  .hero-card{margin-top:90px}
  .steps{grid-template-columns:1fr}
  .guide-grid{grid-template-columns:1fr}
  .roadmap-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:760px){
  .site-header{height:auto;flex-wrap:wrap;padding:12px 16px;gap:8px}
  .site-header nav{width:100%;justify-content:space-between;gap:2px}
  .nav-link{padding:0 6px;font-size:13px;flex:1 1 auto;justify-content:center;white-space:nowrap}
  .site-header nav .petal-toggle{display:grid!important}
  .petal-toggle{margin-left:2px;flex:none}
  .home,.subpage{padding:0 16px}
  .subpage{padding-top:28px}
  .hero h1{font-size:34px;letter-spacing:-.6px}
  .hero-copy>p{font-size:15px}
  .hero-actions .big{width:100%}
  .hero-stats{gap:10px}
  .hero-stats>div{flex:1;min-width:0;padding:12px}
  .hero-stats dd{font-size:24px}
  .hero-stats dt{font-size:11px}
  .hero-kanji{font-size:84px}
  .home-section{padding:36px 0}
  .lesson-cards,.feature-grid{grid-template-columns:1fr;gap:14px}
  .lesson-card{min-height:0}
  .roadmap-panel{padding:20px 16px}
  .roadmap-panel-head .primary{width:100%}
  .quote-band{padding:40px 20px;border-radius:24px}
  .quote-band .big{width:100%}
  .site-footer{padding:22px 16px 28px;font-size:12px}
}
@media(max-width:380px){.nav-link{padding:0 6px;font-size:12px}.brand-sub{display:none}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.branch{animation:none}}

/* ---------- Dark mode: "đêm hoa đào" (yozakura) ---------- */
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#fbe9f1;--muted:#d9aec0;--accent:#ff7aa8;--accent-dark:#ffa3c4;--accent-soft:#4a1f35;--accent-fill:#c2185b;
  --sakura-100:#2f1a28;--sakura-200:#4a2438;--sakura-300:#7a3a5a;--sakura-400:#e06d98;
  --paper:#170d15;--card:#241520;--card-soft:#2b1926;--glass:#241520d9;--line:#3e2436;
  --ok:#86dba8;--ok-soft:#163124;--ok-line:#2f6b48;
  --shadow-sm:0 2px 6px #00000040,0 1px 2px #00000033;
  --shadow-md:0 10px 30px #0000004d,0 0 0 1px #ff7aa80a;
  --shadow-lg:0 24px 60px #00000066,0 0 30px #ff7aa814;
}
[data-theme="dark"] body{background:
  radial-gradient(900px 520px at 85% -10%,#4a1f3555 0,transparent 60%),
  radial-gradient(700px 420px at -10% 40%,#2a1f4a55 0,transparent 60%),
  radial-gradient(1px 1px at 20% 30%,#fff8 50%,transparent 51%),
  radial-gradient(1px 1px at 70% 15%,#fff6 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 45% 60%,#fff5 50%,transparent 51%),
  radial-gradient(1px 1px at 88% 70%,#fff6 50%,transparent 51%),
  var(--paper);background-attachment:fixed}
[data-theme="dark"] ::selection{background:#7a3a5a;color:#fff}
[data-theme="dark"] .hero-art::before{background:radial-gradient(circle at 38% 34%,#fff6dc 0,#f6dcae 28%,#c79a6a 60%,#5c3a3a 100%);opacity:.92;box-shadow:0 0 80px #f6dcae40,0 0 160px #ff7aa822}
[data-theme="dark"] .hero-kanji{color:#7a3a5a}
[data-theme="dark"] .lesson-card-kanji{color:#3a2030}
[data-theme="dark"] .lesson-card:hover .lesson-card-kanji{color:#4a2438}
[data-theme="dark"] .hero h1 em{background:linear-gradient(180deg,transparent 62%,#7a3a5a 62%)}
[data-theme="dark"] .branch path[stroke]{stroke:#a0705e}
[data-theme="dark"] .option.incorrect{background:#3a1d14;border-color:#a35a33;color:#ffc3a0}
[data-theme="dark"] .option.incorrect .option-letter{background:#5a2c18;color:#ffd2b8}
[data-theme="dark"] .option.correct .option-letter{background:#21523a;color:#c9f2d8}
[data-theme="dark"] .blank.filled{color:var(--ok)}
[data-theme="dark"] .needs-review .feedback-icon{background:#3a1d14;color:#ffb48a}
[data-theme="dark"] .needs-review h4{color:#ffb48a}
[data-theme="dark"] .storage-warning{background:#3a2412;color:#ffd6a8;border-color:#7a5228}
[data-theme="dark"] .modal-backdrop{background:#000a}
[data-theme="dark"] .purple{background:var(--accent)}
[data-theme="dark"] .peach{background:#ffb48a}
[data-theme="dark"] .secondary{background:transparent}
[data-theme="dark"] .petal-toggle,[data-theme="dark"] .theme-toggle{background:var(--card)!important}
@media(max-width:760px){[data-theme="dark"] .lesson-list .lesson{background:var(--card);border-color:var(--line)}[data-theme="dark"] .lesson.selected{background:var(--accent-soft);border-color:var(--sakura-300)}}

.theme-toggle{width:44px;height:44px;display:grid;place-items:center;border-radius:999px;border:1px solid var(--line)!important;background:var(--card)!important;color:var(--muted)!important;padding:0!important}
.theme-toggle:hover{border-color:var(--sakura-400)!important;color:var(--accent-dark)!important}
@media(max-width:760px){.site-header nav .theme-toggle{display:grid!important;flex:none}}

/* ---------- Header tools ---------- */
.site-header nav{margin-left:auto}
.header-tools{display:flex;gap:8px;align-items:center}
.header-tools .petal-toggle{margin-left:0}
@media(max-width:760px){
  .header-tools{margin-left:auto;order:2}
  .site-header nav{order:3;margin-left:0}
  .site-header .brand{order:1}
}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------- Streak (inside hero card) ---------- */
.streak{border-top:1px solid var(--line);padding-top:12px;margin-top:2px}
.streak-head{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.streak-head strong{color:var(--accent-dark)}
.streak-week{list-style:none;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0 0;padding:0}
.streak-week li{display:flex;flex-direction:column;align-items:center;gap:4px}
.streak-week small{font-size:10px;color:var(--muted)}
.streak-dot{width:18px;height:18px;border-radius:50%;background:var(--sakura-100);border:1.5px solid var(--line)}
.streak-week li.done .streak-dot{background:radial-gradient(circle at 35% 35%,#ffd6e4,var(--accent-fill));border-color:transparent;box-shadow:0 0 0 3px var(--accent-soft)}
.streak-week li.today small{color:var(--accent-dark);font-weight:700}
.streak-week li.today:not(.done) .streak-dot{border-style:dashed;border-color:var(--sakura-400)}

/* ---------- Today: daily kanji + try question ---------- */
.today-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;align-items:stretch}
.daily-card,.try-card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:var(--shadow-md);display:flex;flex-direction:column;gap:14px;animation:rise .55s cubic-bezier(.2,.7,.3,1) both}
.try-card{animation-delay:.08s}
.daily-card{background:linear-gradient(160deg,var(--card) 40%,var(--accent-soft) 100%);position:relative;overflow:hidden}
.daily-card::after{content:"";position:absolute;right:-60px;bottom:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,var(--sakura-200),transparent 70%);pointer-events:none}
.daily-card>*{position:relative;z-index:1}
.daily-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.daily-date,.try-tag{font-size:12px;color:var(--muted);text-transform:capitalize}
.try-tag{text-transform:none;background:var(--sakura-100);padding:4px 10px;border-radius:999px;color:var(--accent-dark);font-weight:600}
.daily-word{display:flex;align-items:center;gap:20px}
.daily-kanji{font-family:var(--font-display);font-size:64px;line-height:1.1;color:var(--ink);padding:10px 18px;border-radius:20px;background:var(--card);border:1px solid var(--sakura-300);box-shadow:inset 0 -4px 0 var(--sakura-200)}
.daily-reading{display:block;font-size:18px;color:var(--accent-dark);margin-bottom:4px}
.daily-meaning{font-size:20px;color:var(--ink)}
.daily-example{font-size:20px;line-height:1.9;color:var(--ink);margin:4px 0 0}
.daily-example mark{background:linear-gradient(180deg,transparent 55%,var(--sakura-200) 55%);color:inherit;padding:0 2px}
.daily-translation{font-size:14px;line-height:1.8;color:var(--muted);margin:0}
.daily-card .text-button{align-self:flex-start;display:inline-flex;align-items:center;font-size:14px;margin-top:auto;border:0;background:none;padding:8px 10px;margin-left:-10px}
.try-sentence{font-size:22px;line-height:2;color:var(--ink);margin:0}
.try-sentence .blank{display:inline-block;min-width:56px;text-align:center;padding:0 10px;margin:0 4px;border-bottom:2px solid var(--accent);border-radius:6px 6px 0 0}
.try-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.try-option{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;text-align:left;transition:transform .18s ease,background-color .18s ease,border-color .18s ease}
.try-option:not(:disabled):hover{background:var(--sakura-100);border-color:var(--sakura-400);transform:translateY(-1px)}
.try-option:disabled{cursor:default;color:var(--muted)}
.try-option.correct{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.try-option.incorrect{background:#fff1e6;border-color:#bd7650;color:#88441f}
[data-theme="dark"] .try-option.incorrect{background:#3a1d14;border-color:#a35a33;color:#ffc3a0}
.try-result{min-height:0}
.try-verdict{margin:0;font-weight:700;font-size:15px}
.try-verdict.ok{color:var(--ok)}.try-verdict.bad{color:#9a4a17}
[data-theme="dark"] .try-verdict.bad{color:#ffb48a}
.try-translation{margin:6px 0 0;font-size:14px;line-height:1.8;color:var(--muted)}
.try-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto}
.try-actions button{min-height:46px;padding:10px 16px;font-size:14px;gap:8px}
.try-note{font-size:12px;color:var(--muted)}
@media(max-width:960px){.today-grid{grid-template-columns:1fr}}
@media(max-width:760px){.daily-card,.try-card{padding:20px 18px}.daily-kanji{font-size:48px;padding:8px 14px}.daily-meaning{font-size:17px}.daily-example{font-size:18px}.try-sentence{font-size:19px}.try-option{font-size:16px}.try-actions button{flex:1}}

/* Smooth theme switch for surfaces */
body,.site-header,.quiz-card,.feature,.steps li,.daily-card,.try-card,.hero-card,.roadmap-panel,.guide-card{transition:background-color .3s ease,border-color .3s ease,color .3s ease}
.lesson-card{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease,background-color .3s ease}
